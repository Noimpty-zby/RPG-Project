name: Deploy web game
on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', 'tests/sim/**', 'tools/web_test.sh', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Never publish a web build whose rules drifted from the C++ game.
      - run: bash tools/web_test.sh
      - run: rsync -a --exclude tests --exclude package.json web/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
